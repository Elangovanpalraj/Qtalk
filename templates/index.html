<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Nexus - Modern Chat</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
</head>
<body class="dark-theme">
    <div class="app-container">
        <!-- Login Modal -->
        <div id="login-modal" class="modal">
            <div class="modal-content">
                <h2><i class="fa-solid fa-atom"></i> Quantum Nexus</h2>
                <input type="text" id="username-input" placeholder="உங்கள் பெயரை உள்ளிடவும்..." />
                <button onclick="login()">Sign In</button>
            </div>
        </div>
        <!-- Header Bar -->
        <header class="navbar">
            <div class="brand">
                <span class="logo-qwatch">Qwatch</span>
                <span class="divider">|</span>
                <span class="logo-quantum"><i class="fa-solid fa-atom"></i> Quantum Nexus</span>
            </div>
            <div class="nav-controls">
                <button id="theme-toggle" onclick="toggleTheme()"><i class="fa-solid fa-moon"></i></button>
                <span id="user-display"></span>
            </div>
        </header>
        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search contact..." onkeyup="filterContacts()">
                </div>
                <div class="contact-list" id="contact-list"></div>
            </aside>
            <!-- Chat Panel -->
            <main class="chat-area">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h3 id="active-user-name">Select a contact to start chatting</h3>
                        <span id="active-user-status" class="status-indicator"></span>
                    </div>
                    <div class="msg-search-box">
                        <input type="text" id="msg-search-input" placeholder="Search message..." onkeyup="searchMessages()">
                    </div>
                </div>
                <div class="messages-container" id="messages-container"></div>
                <div id="typing-indicator" class="typing-indicator" style="display:none;">typing...</div>
                <div id="emoji-picker-container" class="emoji-picker-popup" style="display: none;">
                    <emoji-picker></emoji-picker>
                </div>
                <div class="chat-input-area">
                    <button class="icon-btn" onclick="toggleEmojiPicker()"><i class="fa-regular fa-face-smile"></i></button>
                    <label for="file-upload" class="icon-btn"><i class="fa-solid fa-paperclip"></i></label>
                    <input type="file" id="file-upload" style="display:none;" onchange="uploadFile()">
                    
                    <input type="text" id="message-input" placeholder="Type a message..." onkeydown="handleKeyPress(event)" oninput="sendTypingStatus()">
                    
                    <button class="icon-btn" id="record-btn" onclick="toggleRecording()"><i class="fa-solid fa-microphone"></i></button>
                    <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </main>
        </div>
    </div>
    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2354/2354-preview.mp3" preload="auto"></audio>
    <script src="/static/js/main.js"></script>
</body>
</html>
