<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qtalk</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="/static/images/icon.png">
</head>
<body>

    <!-- 🟢 1. OTP Login Screen -->
    <div id="loginScreen" class="auth-container">
        <div class="auth-card">
            <img src="/static/images/icon.png" class="qtalk-logo" alt="Qtalk Logo">
            <h2>Welcome to Qtalk</h2>
            <p>Enter your phone number to receive a verification code</p>
            
            <div id="phoneStep">
                <input type="tel" id="userPhone" placeholder="+91 9876543210" autocomplete="off">
                <button onclick="sendOTP()">Send OTP</button>
            </div>

            <div id="otpStep" style="display: none;">
                <input type="text" id="otpCode" placeholder="Enter 6-digit OTP" maxlength="6">
                <button onclick="verifyOTP()">Verify & Login</button>
            </div>
        </div>
    </div>

    <!-- 🟢 2. Main App Screen -->
    <div class="app-container" id="appContainer" style="display: none;">
        
        <!-- Mobile Header View -->
        <div class="mobile-header">
            <div class="brand-info">
                <img src="/static/images/icon.png" class="header-logo" alt="Qtalk">
                <h1 class="brand-title">Qtalk</h1>
            </div>
            <div class="header-actions">
                <i class="fa-solid fa-camera"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
        </div>

        <!-- Left Nav (Desktop Only) -->
        <div class="left-nav desktop-only">
            <div class="top-icons">
                <img src="/static/images/icon.png" class="qtalk-nav-logo" alt="Qtalk">
                <button class="nav-btn active" title="Chats"><i class="fa-solid fa-message"></i></button>
                <button class="nav-btn" title="Calls"><i class="fa-solid fa-phone"></i></button>
            </div>
            <div class="bottom-icons">
                <div class="profile-avatar-small" onclick="openProfileDrawer()" title="Profile">
                    <img src="https://ui-avatars.com/api/?name=User" id="navAvatar" alt="User">
                </div>
            </div>
        </div>

        <!-- Sidebar Panel -->
        <div class="sidebar">
            <div class="sidebar-header desktop-only">
                <h2>Qtalk Chats</h2>
                <div class="header-actions">
                    <button class="icon-btn-ghost" title="Add Contact" onclick="promptAddContact()"><i class="fa-solid fa-user-plus"></i></button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" placeholder="Search contacts..." id="contactSearch">
                </div>
            </div>

            <!-- Real Contact List -->
            <ul class="contact-list" id="userList"></ul>
        </div>

        <!-- Main Chat View -->
        <div class="main-chat" id="mainChatArea">
            <div class="empty-state desktop-only" id="emptyState">
                <div class="empty-content">
                    <img src="/static/images/icon.png" width="80" alt="Qtalk Logo">
                    <h2>Qtalk Desktop</h2>
                    <p>Select a contact to start messaging securely.</p>
                </div>
            </div>

            <!-- Active Chat View -->
            <div class="active-chat-wrapper" id="activeChatWrapper" style="display: none;">
                <div class="chat-header">
                    <button class="back-btn mobile-only" onclick="closeChatMobile()"><i class="fa-solid fa-arrow-left"></i></button>
                    <div class="chat-header-info">
                        <img src="" id="activeAvatar" alt="Avatar">
                        <div>
                            <h3 id="chatWithTitle">Contact Name</h3>
                            <span class="status-subtitle" id="chatStatusText">Offline</span>
                        </div>
                    </div>
                </div>

                <div class="chat-box" id="chatBox"></div>

                <div class="chat-input-bar">
                    <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
