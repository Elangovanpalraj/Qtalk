<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qtalk Web</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #ece5dd; }
        #sidebar { width: 300px; background: #ffffff; border-right: 1px solid #ccc; display: flex; flex-direction: column; }
        #chat-area { flex-grow: 1; display: flex; flex-direction: column; }
        #messages { flex-grow: 1; padding: 20px; overflow-y: auto; }
        #input-area { display: flex; padding: 10px; background: #f0f0f0; }
        #input-area input { flex-grow: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        #input-area button { padding: 10px 15px; margin-left: 5px; background: #075e54; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .user-item { padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; }
        .user-item:hover { background: #f5f5f5; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 60%; width: fit-content; }
        .sent { background: #dcf8c6; margin-left: auto; }
        .received { background: #ffffff; }
    </style>
</head>
<body>

<div id="sidebar">
    <div style="padding:15px; background:#075e54; color:white;"><strong>Qtalk Contacts</strong></div>
    <div id="contacts-list"></div>
</div>

<div id="chat-area">
    <div id="messages"></div>
    <div id="input-area">
        <input type="text" id="message-input" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let activeUserId = 1; // Simulated Auth User ID
    let currentPeerId = null;
    let ws = null;

    function initWebSocket() {
        ws = new WebSocket(`ws://${location.host}/api/chat/ws/${activeUserId}`);
        ws.onmessage = function(event) {
            let msg = JSON.parse(event.data);
            if (msg.sender_id === currentPeerId || msg.sender_id === activeUserId) {
                appendMessage(msg);
            }
        };
    }

    async function loadContacts() {
        let res = await fetch(`/api/contacts/?current_user_id=${activeUserId}`);
        let users = await res.json();
        let container = document.getElementById('contacts-list');
        container.innerHTML = '';
        users.forEach(u => {
            let div = document.createElement('div');
            div.className = 'user-item';
            div.innerText = u.username;
            div.onclick = () => selectContact(u.id);
            container.appendChild(div);
        });
    }

    async function selectContact(peerId) {
        currentPeerId = peerId;
        document.getElementById('messages').innerHTML = '';
        let res = await fetch(`/api/chat/history/${activeUserId}/${peerId}`);
        let history = await res.json();
        history.forEach(appendMessage);
    }

    function appendMessage(msg) {
        let div = document.createElement('div');
        div.className = 'msg ' + (msg.sender_id === activeUserId ? 'sent' : 'received');
        div.innerText = msg.content;
        document.getElementById('messages').appendChild(div);
    }

    function sendMessage() {
        let input = document.getElementById('message-input');
        if (input.value && currentPeerId) {
            ws.send(JSON.stringify({
                receiver_id: currentPeerId,
                content: input.value
            }));
            input.value = '';
        }
    }

    initWebSocket();
    loadContacts();
</script>

</body>
</html>
